server.port=${PORT:8080}

# --- Banco de dados (PostgreSQL) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/fifa}
spring.datasource.username=${DB_USER:fifa}
spring.datasource.password=${DB_PASSWORD:fifa}
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=10

# Cria a tabela e o índice na subida (idempotente)
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# Threads virtuais (Java 21): melhor throughput sob muitas requisições
spring.threads.virtual.enabled=true

# --- Autenticação (extra +10 pts). Deixe vazio para desligar. ---
app.api-key=${API_KEY:}

# --- Carga em lote: informe o CSV para carregar e encerrar ---
# java -jar fifa-api.jar --app.load-csv=data/fifa.csv
app.load-csv=

spring.main.banner-mode=off
logging.level.root=WARN
logging.level.br.univates=INFO
